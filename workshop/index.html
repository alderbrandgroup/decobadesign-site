<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formation Design d'intérieur — DECOBA Design</title>
<meta name="description" content="Formation en ligne au design d'intérieur par DECOBA Design : notions de design, logiciels et IA appliquée au design. Ouvert à tous. Rejoignez le groupe." />
<link rel="icon" type="image/png" href="../img/logo-officiel.png" />
<meta name="theme-color" content="#F7F4EF" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Formation Design d'intérieur — DECOBA Design" />
<meta property="og:description" content="Notions de design · Logiciels · IA en design. En ligne, ouvert à tous." />
<meta property="og:image" content="https://decobadesign.com/workshop/visuel.jpg" />
<meta property="og:url" content="https://decobadesign.com/workshop" />
<meta property="og:locale" content="fr_FR" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#B66A4A; --charcoal:#171717; --ivory:#F7F4EF; --white:#FFFFFF;
  --sand:#DED3C5; --taupe:#6F6259; --brass:#A88A58;
  --wa:#25D366; --wa-dark:#1DAE54;
  --font-display:"Cormorant Garamond",Georgia,serif;
  --font-sans:"Manrope",Arial,sans-serif;
  --radius:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--ivory)}
body{font-family:var(--font-sans);color:var(--charcoal);-webkit-font-smoothing:antialiased;line-height:1.6}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}

.page{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:1.05fr .95fr}
.panel{display:flex;flex-direction:column;justify-content:center;padding:clamp(2.4rem,5vw,5rem);gap:22px}
.logo{width:150px;height:auto;margin-bottom:6px}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
h1{font-family:var(--font-display);font-weight:500;font-size:clamp(2.5rem,4.6vw,4.4rem);line-height:1.02;letter-spacing:-.01em;max-width:14ch}
.sub{font-size:clamp(1.05rem,1.4vw,1.25rem);color:var(--taupe);max-width:46ch;line-height:1.55}
.sub b{color:var(--charcoal);font-weight:600}

.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px}
.tag{font-size:.82rem;font-weight:500;color:var(--taupe);border:1px solid rgba(23,23,23,.14);border-radius:2px;padding:7px 14px;background:var(--white)}

.wa-btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:var(--wa);color:#fff;
  font-family:var(--font-sans);font-weight:600;font-size:1.02rem;letter-spacing:.01em;padding:18px 30px;border-radius:var(--radius);
  transition:background .3s ease,transform .3s ease;max-width:420px;box-shadow:0 10px 26px rgba(37,211,102,.24)}
.wa-btn:hover{background:var(--wa-dark);transform:translateY(-1px)}
.wa-btn svg{width:24px;height:24px;flex:none}
.micro{font-size:.85rem;color:var(--taupe)}
.micro span{color:var(--brand);font-weight:600}

.visual{position:relative;overflow:hidden}
.visual img{width:100%;height:100%;object-fit:cover}
.visual::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(247,244,239,.25),rgba(247,244,239,0) 22%)}

/* apparition douce, respecte reduced-motion */
.fade{opacity:0;transform:translateY(16px);animation:fade .7s cubic-bezier(.22,1,.36,1) forwards}
.fade.d1{animation-delay:.08s}.fade.d2{animation-delay:.16s}.fade.d3{animation-delay:.24s}.fade.d4{animation-delay:.32s}.fade.d5{animation-delay:.4s}
@keyframes fade{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none}}

@media(max-width:820px){
  .page{grid-template-columns:1fr;grid-template-rows:34svh 1fr}
  .visual{order:0}
  .panel{order:1;justify-content:flex-start;padding:26px 22px 34px;gap:16px}
  .logo{width:112px;margin-bottom:0}
  h1{font-size:clamp(2rem,8.5vw,2.7rem)}
  .wa-btn{width:100%;max-width:none;font-size:1rem;padding:17px 24px}
}
</style>
</head>
<body>
<main class="page">
  <section class="panel">
    <img class="logo fade" src="logo.png" alt="DECOBA design" width="150" />
    <div class="eyebrow fade d1">Formation en ligne</div>
    <h1 class="fade d1">Apprends le design d'intérieur.</h1>
    <p class="sub fade d2">Une formation claire pour maîtriser les <b>notions de design</b>, les <b>logiciels</b> et l'<b>IA appliquée au design</b>. En ligne, ouverte à tous.</p>
    <div class="tags fade d2">
      <span class="tag">Notions de design</span>
      <span class="tag">Logiciels</span>
      <span class="tag">IA en design</span>
    </div>
    <a class="wa-btn fade d3" href="https://chat.whatsapp.com/KRUgiYfzBCE0UZ13Yl8laF" target="_blank" rel="noopener" aria-label="Rejoindre le groupe WhatsApp">
      <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16.04 3.2c-7.1 0-12.86 5.76-12.86 12.86 0 2.27.6 4.48 1.73 6.43L3.1 28.8l6.5-1.7a12.8 12.8 0 0 0 6.44 1.74h.01c7.1 0 12.86-5.76 12.86-12.86S23.14 3.2 16.04 3.2Zm0 23.42h-.01a10.6 10.6 0 0 1-5.4-1.48l-.39-.23-4.01 1.05 1.07-3.91-.25-.4a10.55 10.55 0 0 1-1.62-5.63c0-5.87 4.78-10.65 10.66-10.65 2.85 0 5.52 1.11 7.53 3.12a10.57 10.57 0 0 1 3.12 7.54c0 5.87-4.78 10.65-10.65 10.65Zm5.85-7.98c-.32-.16-1.9-.94-2.19-1.04-.29-.11-.5-.16-.72.16-.21.32-.82 1.04-1.01 1.25-.19.21-.37.24-.69.08-.32-.16-1.35-.5-2.57-1.59-.95-.85-1.59-1.9-1.78-2.22-.19-.32-.02-.49.14-.65.14-.14.32-.37.48-.56.16-.19.21-.32.32-.53.11-.21.05-.4-.03-.56-.08-.16-.72-1.74-.99-2.38-.26-.62-.53-.54-.72-.55l-.62-.01c-.21 0-.56.08-.85.4-.29.32-1.11 1.09-1.11 2.66 0 1.57 1.14 3.08 1.3 3.29.16.21 2.25 3.43 5.45 4.81.76.33 1.35.52 1.82.67.76.24 1.46.21 2.01.13.61-.09 1.9-.78 2.17-1.53.27-.75.27-1.4.19-1.53-.08-.13-.29-.21-.61-.37Z"/></svg>
      Rejoindre le groupe WhatsApp
    </a>
    <div class="micro fade d4"><span>Places limitées</span> · démarrage prochainement</div>
  </section>
  <aside class="visual">
    <img src="visuel.jpg" alt="Intérieur conçu par DECOBA Design" />
  </aside>
</main>
</body>
</html>
